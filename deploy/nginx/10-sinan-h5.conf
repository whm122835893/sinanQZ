# =====================================================================
# 司南ART · C 端 H5（sinan-art-source 构建产物）
#
# 监听 80 —— 用户手机浏览器直接访问 http://<公网IP>/
#
# 放置位置（宝塔）：/www/server/panel/vhost/nginx/10-sinan-h5.conf
# 产物上传到：      /www/wwwroot/sinan-h5/   （即本地 dist/ 里的内容）
# =====================================================================

server {
    listen 80 default_server;
    server_name _;

    root  /www/wwwroot/sinan-h5;
    index index.html;

    charset utf-8;
    access_log /www/wwwlogs/sinan-h5.access.log;
    error_log  /www/wwwlogs/sinan-h5.error.log;

    # ---- 上传体积闸门：显式钉死 50m（防火，不是救火）----
    # 2026-10-11 实测更正：生产 nginx.conf 的 http 层本就有 `client_max_body_size 50m;`，
    # 这条指令可在 http / server / location 三层设、上层往下继承，所以补这一行之前
    # 本站点的实际限额早就是 50m，「上传不了图片」跟 413 无关（实测：2MB/6MB 的请求体
    # 都能穿到 PHP，拿到的是平台的 {"code":4001…} JSON，而不是 nginx 的 HTML 413 页）。
    # 写这一行的理由只剩一个：面板升级或「修复配置」可能把 http 层那行改回默认 1m，
    # 而别的站点设置继承不过来，本站点自己写明才稳。php.ini 侧是 50M/50M，保持一致。
    # C 端目前没有上传入口，这一行与 20-sinan-admin.conf 对齐，顺带堵住以后加上传时的坑。
    client_max_body_size 50m;

    # ---- 带宽只有 1Mbps，压缩是必开项，不是优化项 ----
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff font/woff2 application/font-sfnt;

    # ---- 前端路由：history 模式刷新不能 404 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口文件绝不缓存，否则发版后用户拿旧 index.html 引用已删除的 hash 资源
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # vite 产物文件名带 hash，可安全长缓存（省的就是那 1Mbps）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- C 端接口：原样转发，保留 /api 前缀 ----
    # 对应 route/api.php 的 Route::group('/api', ...) → app\controller\*
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout 120s;
    }

    # 后台接口不暴露在 C 端端口上
    location /api/admin/ {
        return 404;
    }

    # ---- 藏品图片：后端落盘的真实文件，直出不过 PHP ----
    location /uploads/ {
        alias /www/wwwroot/sinan-backend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ /(\.env|\.git|runtime) {
        deny all;
        return 404;
    }
}
