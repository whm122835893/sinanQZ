# =====================================================================
# 司南ART · C 端 H5（sinan-art-source 构建产物）
#
# 监听 80 —— 用户手机浏览器直接访问 http://<公网IP>/
#
# 放置位置（宝塔）：/www/server/panel/vhost/nginx/10-sinan-h5.conf
# 产物上传到：      /www/wwwroot/sinan-h5/   （即本地 dist/ 里的内容）
# =====================================================================

server {
    listen 80 default_server;
    server_name _;

    root  /www/wwwroot/sinan-h5;
    index index.html;

    charset utf-8;
    access_log /www/wwwlogs/sinan-h5.access.log;
    error_log  /www/wwwlogs/sinan-h5.error.log;

    # ---- 带宽只有 1Mbps，压缩是必开项，不是优化项 ----
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff font/woff2 application/font-sfnt;

    # ---- 前端路由：history 模式刷新不能 404 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口文件绝不缓存，否则发版后用户拿旧 index.html 引用已删除的 hash 资源
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # vite 产物文件名带 hash，可安全长缓存（省的就是那 1Mbps）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- C 端接口：原样转发，保留 /api 前缀 ----
    # 对应 route/api.php 的 Route::group('/api', ...) → app\controller\*
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout 120s;
    }

    # 后台接口不暴露在 C 端端口上
    location /api/admin/ {
        return 404;
    }

    # ---- 藏品图片：后端落盘的真实文件，直出不过 PHP ----
    location /uploads/ {
        alias /www/wwwroot/sinan-backend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ /(\.env|\.git|runtime) {
        deny all;
        return 404;
    }
}
