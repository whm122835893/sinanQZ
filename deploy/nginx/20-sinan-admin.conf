# =====================================================================
# 司南ART · 管理后台（sinan-admin 构建产物）
#
# 监听 8088 —— 访问 http://<公网IP>:8088/
# 单独端口有两个好处：
#   1) 没域名的情况下，浏览器无法按域名区分站点，只能靠端口
#   2) 后台可以直接在阿里云安全组里做 IP 白名单，只放行你自己的出口 IP
#
# 放置位置（宝塔）：/www/server/panel/vhost/nginx/20-sinan-admin.conf
# 产物上传到：      /www/wwwroot/sinan-admin/  （即本地 dist/ 里的内容）
# =====================================================================

server {
    listen 8088;
    server_name _;

    root  /www/wwwroot/sinan-admin;
    index index.html;

    charset utf-8;
    access_log /www/wwwlogs/sinan-admin.access.log;
    error_log  /www/wwwlogs/sinan-admin.error.log;

    # ---- 后台 JS+CSS 压缩后约 1.08MB，1Mbps 下不压缩会慢到无法使用 ----
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff font/woff2 application/font-sfnt;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- 后台接口：剥掉 /api 前缀再转发 ----
    # 与 sinan-admin/vite.config.js 里 rewrite: p => p.replace(/^\/api/, '') 完全等价：
    #   /api/admin/user/list  →  /admin/user/list  →  app\admin 多应用
    # 必须写在下面那条通用 /api/ 之前，且用 ^~ 提升优先级。
    location ^~ /api/admin/ {
        rewrite ^/api/admin/(.*)$ /admin/$1 break;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout 120s;
    }

    # 后台页面里偶尔也会调 C 端公开接口（如图形验证码）
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        alias /www/wwwroot/sinan-backend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ /(\.env|\.git|runtime) {
        deny all;
        return 404;
    }
}
