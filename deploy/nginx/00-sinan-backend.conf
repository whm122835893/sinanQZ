# =====================================================================
# 司南ART · 后端内部站点（ThinkPHP 8）
#
# 只监听 127.0.0.1:8081，公网不可直连；由 H5 / 后台两个站反代进来。
# 这样做的目的：完整复刻本地开发时 vite proxy 的语义，前端零改动。
#
# 放置位置（宝塔）：/www/server/panel/vhost/nginx/00-sinan-backend.conf
# 需要按实际 PHP 版本改的只有一处：php-cgi-82.sock 里的 82。
#   查看当前 socket：ls -l /tmp/php-cgi-*.sock
# =====================================================================

server {
    listen 127.0.0.1:8081;
    server_name sinan-backend.internal;

    root  /www/wwwroot/sinan-backend/public;
    index index.php;

    charset utf-8;
    client_max_body_size 50m;   # 藏品图上传，别用默认 1m

    access_log /www/wwwlogs/sinan-backend.access.log;
    error_log  /www/wwwlogs/sinan-backend.error.log;

    # ---- ThinkPHP 伪静态：真实文件直出，其余交给 index.php ----
    location / {
        try_files $uri $uri/ /index.php$uri?$query_string;
    }

    location ~ \.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include /www/server/nginx/conf/fastcgi.conf;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass  unix:/tmp/php-cgi-82.sock;   # ← PHP 版本改这里
        fastcgi_index index.php;
        fastcgi_read_timeout 120s;
    }

    # ---- 兜底防泄漏：即使被误配成公网站点，这几条也拦住敏感路径 ----
    location ~ (^/runtime|^/\.|/\.env|/\.git|/composer\.) {
        deny all;
        return 404;
    }
}
